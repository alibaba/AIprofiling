[package]
name = "CollectionFramework"
version = "0.4.4"
edition = "2021"

[dependencies]
serde_json = "1.0"
anyhow = "1.0.98"
dirs = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9.34"
tokio = { version = "1.0", features = ["full"] }
libloading = "0.7"
libc = "0.2"
clap = { version = "4.0", features = ["derive"] }
signal-hook = "0.3"
once_cell = "1.18"
nvml-wrapper = "0.7"
num_cpus = "1.0"
chrono = { version = "0.4", features = ["clock"] }
glob = "0.3"
lazy_static = "1.5"
regex = "1.0"
fifo = { version = "0.1.0", path = "fifo", features = ["protocal_gp"] }
ossrs = { version = "0.1.0", path = "ossrs" }
slsrs = { version = "0.1.0", path = "slsrs" }
dashrs = { version = "0.1.0", path = "dashrs" }
tracing-subscriber = { workspace = true }
tracing = { workspace = true}
async-trait = "0.1"
base64 = "0.22.1"

[dev-dependencies]
tempfile = "3"

[workspace]
members = [
"fifo",
"ossrs",
"slsrs",
"dashrs",
"client"
]

[workspace.dependencies]
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[build-dependencies]
bindgen = "0.72.0"
