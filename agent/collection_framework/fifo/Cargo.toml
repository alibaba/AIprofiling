[package]
name = "fifo"
version = "0.1.0"
edition = "2021"

[dependencies]
cpp_demangle = "0.4.4"
jzon = "0.12.5"
nix = { version = "0.29.0", features = ["fs"] }
nom = { version = "7.1.3", optional = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true}
pretty-hex = "0.4.1"

[features]
protocal_gp = []
protocal_ascii = ["dep:nom"]

[build-dependencies]
bindgen = "0.71.1"

[dev-dependencies]
futures = "0.3.31"
rand = "0.9.0"
tracing-subscriber = { workspace = true }
